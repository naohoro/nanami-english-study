<h2>まず、どちらから始める？</h2>
<p class="subtitle">最初のバージョンで集中して作るのはどちらですか？</p>

<div class="options">
  <div class="option" data-choice="math" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>数学I・A から始める</h3>
      <p>看護系入試では数学が大きな壁になりやすい。「どこで詰まっているか」を診断するのに向いている。単元が明確で診断ロジックを作りやすい。</p>
    </div>
  </div>
  <div class="option" data-choice="english" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>英語 から始める</h3>
      <p>単語・文法・読解と段階が明確。「何が分かっていないか」を問題別に特定しやすい。看護系でも英語は必須科目。</p>
    </div>
  </div>
  <div class="option" data-choice="both" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>両方同時に作る</h3>
      <p>最初から2科目対応。ただし開発量が倍になり、完成が遅れるリスクあり。</p>
    </div>
  </div>
</div>
